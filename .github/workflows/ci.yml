name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  numbers:
    # The argument of this repository is that a number reported by an
    # instrument did not survive re-derivation from the stored evidence. So the
    # same rule is applied to this repository: every figure quoted in the
    # README is recomputed from the committed data, and drift fails the build.
    # Standard library only, no model, no network -- about six seconds.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/verify_readme_numbers.py
